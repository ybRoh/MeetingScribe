name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./Tests/check-swift.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project Tests/Windows/Checks.csproj
      - run: dotnet build Windows/MeetingScribe.csproj -c Release -r win-x64
